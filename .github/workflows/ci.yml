# SPDX-License-Identifier: Apache-2.0
# Linux CI on every push and pull request: data admission + secret scan over the tree and the full history, and the
# internal-ID gate (no internal process IDs or workspace paths in tracked files or new commit messages).
# (Swift build/test jobs are added when Package.swift exists; macOS minutes are manual-only while private.)
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz (GitHub release asset digest, checked 2026-11-01).
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  data-admission:
    name: Data admission + secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests: check the PR head, not GitHub's synthetic merge commit (its identity is GitHub's).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # every commit in the history is checked
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -eu
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          echo "FACEBLUR_GITLEAKS=$dir/gitleaks" >> "$GITHUB_ENV"

      - name: Data admission (tree + full history; config/data-admission/README.md)
        run: |
          set -eu
          if [ ! -f config/data-admission/check.sh ]; then
            echo "::error::config/data-admission/check.sh is missing; data admission cannot be skipped"
            exit 1
          fi
          sh config/data-admission/check.sh ci --all

      # Public files and commit messages carry no internal process IDs or workspace paths; the (empty) baseline may
      # not grow. Commit messages are checked from the gate's cut-off date on (scripts/check-internal-ids.py).
      - name: No internal IDs in files or commit messages
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          python3 -I scripts/check-internal-ids.py --tree
          if [ "$REF" = "refs/heads/main" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git merge-base origin/main HEAD)
          fi
          python3 -I scripts/check-internal-ids.py --range "$base..HEAD"
          python3 -I scripts/check-internal-ids.py --baseline-shrinks-only "$base"

      - name: Planted-violation self-tests of the internal-ID gate and hooks
        run: sh scripts/test-id-gate.sh
